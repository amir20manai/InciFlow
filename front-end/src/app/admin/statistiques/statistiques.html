<div class="statistics-container">
  <!-- En-tête de la page -->
  <header class="top-header">
    <div class="header-left">
      <h1 class="page-title">Statistiques</h1>
    </div>
  </header>

  <!-- Contenu principal -->
  <main class="main-body">
    
    <!-- Cartes des métriques (4 priorités) -->
    <div class="metrics-grid four-cols">
      <div class="metric-card" *ngFor="let m of metrics" [style.border-left]="'5px solid ' + m.border" [style.background-color]="m.bg">
        <div class="metric-info">
          <span class="metric-title">{{ m.title }}</span>
          <h3 class="metric-value" [style.color]="m.color">{{ m.value }}</h3>
        </div>
      </div>
    </div>

    <!-- Section du milieu : Incidents par catégorie & Charge par technicien -->
    <div class="charts-row">
      <!-- Carte : Incidents par catégorie -->
      <div class="panel-card chart-category-card">
        <div class="chart-header">
          <h3 class="panel-title">Incidents par catégorie</h3>
        </div>
        <div class="bars-container-horizontal">
          <div class="bar-row" *ngFor="let cat of categoryStats">
            <div class="cat-info">
              <span class="cat-name">{{ cat.name }}</span>
              <span class="cat-count">{{ cat.count }}</span>
            </div>
            <div class="bar-track-h">
              <div class="bar-fill-h" [style.width]="cat.width" [style.background-color]="cat.color"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Carte : Charge par technicien -->
      <div class="panel-card chart-status-card">
        <div class="chart-header">
          <h3 class="panel-title">Charge par technicien</h3>
        </div>
        <div class="tech-list">
          <div class="tech-item" *ngFor="let s of statusBreakdown">
            <div class="tech-user-info">
              <div class="tech-avatar">{{ s.initials }}</div>
              <span class="tech-name">{{ s.label }}</span>
            </div>
            <span class="tech-val">{{ s.count }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Section du bas : Incidents par département -->
    <div class="panel-card weekly-trend-card">
      <div class="chart-header">
        <h3 class="panel-title">Incidents par département</h3>
      </div>
      <div class="weekly-bars-container">
        <div class="weekly-bar-group" *ngFor="let w of weeklyTrend">
          <!-- Badge avec le nombre (visible si > 0) -->
          <span class="dept-count-badge" *ngIf="w.count > 0">{{ w.count }}</span>
          <div class="bar-track">
            <div class="bar-fill" [style.height]="w.height" style="background-color: #2563eb;"></div>
          </div>
          <span class="bar-label">{{ w.day }}</span>
        </div>
      </div>
    </div>

  </main>
</div>
