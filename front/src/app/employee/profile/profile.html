<div class="profile-page">
  <header class="top-header">
    <h1 class="page-title">Profile</h1>
  </header>

  <main class="profile-content">
    <div class="profile-hero-card">
      <div class="hero-banner-bg"></div>
      <div class="hero-content">
        <div class="avatar-container">
          <div class="avatar-large">{{ initials }}</div>
        </div>
        <div class="hero-text">
          <h2>{{ fullName }}</h2>
          <span class="admin-badge">
            {{ role }}
          </span>
        </div>
      </div>
    </div>

    <div class="profile-grid">
      <!-- قسم المعلومات الشخصية -->
      <div class="profile-card">
        <div class="card-header">
          <h3>Personal Information</h3>
          <p>Update your details</p>
        </div>

        <form class="form-grid" (ngSubmit)="updateProfile()">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" [(ngModel)]="firstName" name="firstName" placeholder="First name">
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Last name">
          </div>
          <div class="input-group">
            <label>Email</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" [(ngModel)]="email" name="email" placeholder="Email">
            </div>
          </div>
          <div class="input-group">
            <label>Department</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              <input type="text" class="form-control" [(ngModel)]="department" name="department" placeholder="Department">
            </div>
          </div>
          <div class="input-group">
            <label>Phone</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input type="text" [(ngModel)]="phone" name="phone" placeholder="Phone">
            </div>
          </div>
        </form>

        <div class="form-action-right">
          <button class="btn-blue" (click)="updateProfile()">Update profile</button>
        </div>
      </div>

      <!-- قسم تغيير كلمة السر -->
      <div class="profile-card">
        <div class="card-header">
          <h3>Change Password</h3>
        </div>

        <form class="form-stack">
          <div class="input-group">
            <label>Current password</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" [(ngModel)]="currentPassword" name="currentPassword" placeholder="••••••••">
            </div>
          </div>
          <div class="input-group">
            <label>New password</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••">
            </div>
          </div>
          <div class="input-group">
            <label>Confirm new password</label>
            <div class="input-icon-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••">
            </div>
          </div>
        </form>

        <div class="form-action-right">
          <button class="btn-blue" (click)="changePassword()">Change password</button>
        </div>
      </div>
    </div>
  </main>
</div>
