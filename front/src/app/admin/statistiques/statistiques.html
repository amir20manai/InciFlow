<div class="statistics-container">
  <!-- Top Header -->
  <header class="top-header">
    <div class="header-left">
      <h1 class="page-title">Statistics</h1>
    </div>
  </header>

  <!-- Main Body -->
  <main class="main-body">
    
    <!-- Top Metrics Cards Grid -->
    <div class="metrics-grid">
      <div class="metric-card" *ngFor="let m of metrics">
        <div class="metric-header">
          <div class="metric-icon" [style.background-color]="m.iconBg" [style.color]="m.iconColor">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <span class="trend-badge" [class.positive]="m.isPositive" [class.negative]="!m.isPositive">
            {{ m.trend }}
          </span>
        </div>
        <div class="metric-content">
          <span class="metric-title">{{ m.title }}</span>
          <h2 class="metric-value">{{ m.value }}</h2>
        </div>
      </div>
    </div>

    <!-- Middle Section: Incidents by Category & Status Breakdown -->
    <div class="charts-row">
      <!-- Incidents by Category -->
      <div class="panel-card chart-category-card">
        <div class="chart-header">
          <div>
            <h3 class="panel-title">Incidents by Category</h3>
            <p class="panel-subtitle">Last 30 days</p>
          </div>
        </div>
        <div class="bars-container">
          <div class="bar-group" *ngFor="let cat of categoryStats">
            <div class="bar-track">
              <div class="bar-fill" [style.height]="cat.height" [style.background-color]="cat.color"></div>
            </div>
            <span class="bar-label">{{ cat.name }}</span>
          </div>
        </div>
      </div>

      <!-- Status Breakdown -->
      <div class="panel-card chart-status-card">
        <div class="chart-header">
          <div>
            <h3 class="panel-title">Status Breakdown</h3>
          </div>
        </div>
        <div class="status-content">
          <div class="donut-chart-box">
            <div class="donut-hole">
              <span class="donut-total-val">8</span>
              <span class="donut-total-lbl">Total</span>
            </div>
          </div>
          <div class="status-legend">
            <div class="legend-item" *ngFor="let s of statusBreakdown">
              <div class="legend-info">
                <span class="legend-dot" [style.background-color]="s.color"></span>
                <span class="legend-text">{{ s.label }}</span>
              </div>
              <span class="legend-val">{{ s.count }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Section: Weekly Trend -->
    <div class="panel-card weekly-trend-card">
      <div class="chart-header">
        <div>
          <h3 class="panel-title">Weekly Trend</h3>
          <p class="panel-subtitle">Incidents reported per day</p>
        </div>
      </div>
      <div class="weekly-bars-container">
        <div class="weekly-bar-group" *ngFor="let w of weeklyTrend">
          <div class="bar-track">
            <div class="bar-fill" [style.height]="w.height" style="background-color: #2563eb;"></div>
          </div>
          <span class="bar-label">{{ w.day }}</span>
        </div>
      </div>
    </div>

  </main>
</div>
